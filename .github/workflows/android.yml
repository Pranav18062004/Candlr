name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Test and build unsigned release candidate
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:bundleRelease :app:assemblePreview --no-daemon --console=plain
      - name: Audit offline permissions and package
        run: python3 scripts/audit_package.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: candlr-validation
          retention-days: 14
          path: |
            app/build/reports/
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/mapping/release/mapping.txt
            artifacts/package-audit.json
